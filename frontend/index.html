<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 小镇</title>
    <link rel="stylesheet" href="/ui-overlay.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            overflow: hidden;
        }
        #game-shell {
            position: relative;
            width: 100vw;
            height: 100vh;
            --ui-safe-area: 16px;
            --ui-text-scale: 1;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        #loading h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        #loading p {
            font-size: 1rem;
            color: #888;
        }
        #ui-overlay {
            font-size: calc(1rem * var(--ui-text-scale));
        }
        #ui-overlay .hud-container {
            padding-inline: var(--ui-safe-area);
        }
        #ui-overlay .dialogue-box {
            bottom: var(--ui-safe-area);
            max-width: calc(100% - (2 * var(--ui-safe-area)));
        }
        #ui-overlay.ui-layout-compact .hud-container {
            gap: 12px;
        }
        #fullscreen-toggle {
            position: absolute;
            right: var(--ui-safe-area);
            bottom: var(--ui-safe-area);
            z-index: 1100;
            min-width: 96px;
            min-height: 40px;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>AI 小镇</h1>
        <p>正在加载...</p>
    </div>
    <div id="game-shell" tabindex="-1">
        <div id="game-container"></div>
        <div id="ui-overlay"></div>
        <button
            id="fullscreen-toggle"
            type="button"
            aria-pressed="false"
        >进入全屏</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
