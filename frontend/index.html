<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 小镇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            overflow: hidden;
        }
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1000;
        }
        #loading h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        #loading p {
            font-size: 1rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>AI 小镇</h1>
        <p>正在加载...</p>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
